<!DOCTYPE html>
<html lang="tg">
<head>

    <!-- Пайваст кардани файли CSS -->

<body>

    <!-- Сарлавҳаи сайт -->

        <div class="container">
            <h1>Хуш омадед ба сайти ман!</h1>
            <p>Инҷо лоиҳаҳо ва корҳои эҷодии манд.</p>
        </div>
    </header>

    <!-- Қисми асосии мундариҷа -->

        <section class="card">
            <h2>Дар бораи ман</h2>
            <p>Ман барномасоз ҳастам ва ин сайти шахсии худро дар GitHub месозам.</p>
            <button id="clickBtn">Тугмаро зер кунед</button>
            <p id="message" class="hidden"></p>
        </section>
    </main>

    <!-- Поёни саҳифа -->
    <footer>
        <p>&copy; 2026 Ҳамаи ҳуқуқҳо ҳифз шудаанд.</p>
    </footer>

    <!-- Пайваст кардани файли JavaScript -->
    <script src="script.js"></script>

</html>
